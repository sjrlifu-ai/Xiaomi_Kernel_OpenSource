name: Build K80 Kernel (SukiSU Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex git gnupg imagemagick \
            libncurses-dev libreadline-dev \
            libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-17-jdk \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 10G

      - name: Integrate SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Fix all missing Kconfig references
        run: |
          find . -name "Kconfig" -exec grep -h 'source "' {} \; 2>/dev/null | \
            sed 's/.*source "//;s/".*//' | sort -u | while read f; do
            if [ ! -f "$f" ]; then
              mkdir -p "$(dirname "$f")"
              touch "$f"
              echo "Created: $f"
            fi
          done

      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== Available defconfigs ==="
          find arch/arm64/configs/ -name "*defconfig" 2>/dev/null | sort
          echo ""
          echo "=== vendor/ config files ==="
          find arch/arm64/configs/vendor/ -name "*zorn*" -type f 2>/dev/null | sort
          echo ""
          echo "=== gki_defconfig ==="
          cat arch/arm64/configs/gki_defconfig 2>/dev/null | head -10

          # Step 1: Start with gki_defconfig
          make gki_defconfig

          # Step 2: Merge zorn_consolidate.config on top
          ZORN_CONFIG="arch/arm64/configs/vendor/zorn_consolidate.config"
          if [ -f "$ZORN_CONFIG" ]; then
            echo "=== Merging $ZORN_CONFIG ==="
            echo "Content preview:"
            echo "================================"
            cat "$ZORN_CONFIG" | head -30
            echo "================================"
          else
            echo "=== zorn_consolidate.config not found ==="
            echo "=== Trying with gki_defconfig only ==="
          fi

          # Step 3: Enable SukiSU Ultra options
          scripts/config --enable CONFIG_KPM
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --enable CONFIG_MODULES

          make olddefconfig
          make -j$(nproc) 2>&1 | tee build.log

      - name: Show build result
        if: always()
        run: |
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log 2>/dev/null || echo "No build log"
          echo ""
          echo "=== Actual errors ==="
          grep -n "error:" build.log 2>/dev/null | tail -30 || echo "No errors found"
          echo ""
          echo "=== arch/arm64/boot/ ==="
          ls -la arch/arm64/boot/ 2>/dev/null || echo "No arch/arm64/boot/"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp arch/arm64/boot/Image AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image AnyKernel3/ 2>/dev/null || \
          { echo "ERROR: No kernel image found"; exit 1; }
          cd AnyKernel3
          zip -r9 ../kernel-zorn-sukisu.zip . -x "*.git*"

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zorn-sukisu
          path: kernel-zorn-sukisu.zip