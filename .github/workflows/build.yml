      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== Available defconfigs ==="
          ls arch/arm64/configs/

          DEFCONFIG=$(find arch/arm64/configs -name "*zorn*perf*" -o -name "*zorn*_defconfig" | head -1)
          echo "Using defconfig: $DEFCONFIG"

          if [ -z "$DEFCONFIG" ]; then
            echo "No zorn defconfig found, using defconfig"
            make defconfig
          else
            make $DEFCONFIG
          fi

          scripts/config --enable CONFIG_KPM
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL

          # 集成 SukiSU Ultra 的 Kconfig 文件
          if [ -f "SukiSU-Ultra/drivers/misc/Kconfig" ]; then
            cp "SukiSU-Ultra/drivers/misc/Kconfig" "drivers/misc/Kconfig"
            echo "SukiSU Kconfig integrated"
          else
            echo "WARNING: SukiSU Kconfig not found, skipping"
          fi

          make olddefconfig
          make -j$(nproc) 2>&1 | tee build.log