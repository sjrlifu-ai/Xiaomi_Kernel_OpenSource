name: Build K80 Kernel (SukiSU Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

                 - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex g++-multilib gcc-multilib git \
            gnupg imagemagick libncurses6-dev \
            libncurses-dev libreadline-dev \
            libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-17-jdk

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 10G

      - name: Integrate SukiSU Ultra
        run: |
          # 手动安装 SukiSU Ultra 所需工具
          apt install -y git curl

          # 下载 SukiSU Ultra 内核脚本
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" -o setup.sh
          chmod +x setup.sh

          # 先检查当前内核配置
          echo "=== 当前配置 ==="
          grep -n "CONFIG_KALLSYMS\|CONFIG_KPM\|CONFIG_KALLSYMS_ALL" config | head -10

          # 手动集成 SukiSU Ultra
          # 1. 先获取当前内核配置
          echo "=== 获取当前配置 ==="
          make savedefconfig > .config

          # 2. 手动开启 SukiSU Ultra 所需配置
          echo "=== 开启 SukiSU Ultra 配置 ==="
          sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' .config
          sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' .config
          sed -i 's/# CONFIG_KALLSYMS_BASE is not set/CONFIG_KALLSYMS_BASE=y/' .config
          sed -i 's/# CONFIG_KALLSYMS_BASE_ALL is not set/CONFIG_KALLSYMS_BASE_ALL=y/' .config
          sed -i 's/# CONFIG_KALLSYMS_UNCOMPRESSED is not set/CONFIG_KALLSYMS_UNCOMPRESSED=y/' .config
          sed -i 's/# CONFIG_KALLSYMS_SORTED is not set/CONFIG_KALLSYMS_SORTED=y/' .config

          # 3. 重新生成 config
          echo "=== 重新生成 config ==="
          make olddefconfig

          # 4. 检查配置是否生效
          echo "=== 配置生效 ==="
          grep -n "CONFIG_KALLSYMS\|CONFIG_KPM\|CONFIG_KALLSYMS_ALL" config | head -10

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # 查找 defconfig
          DEFCONFIG=$(find arch/arm64/configs -name "*zorn*perf*" -o -name "*zorn*_defconfig" | head -1)
          echo "Using defconfig: $DEFCONFIG"

          make $DEFCONFIG

          # 启用 SukiSU Ultra 所需的内核配置
          scripts/config --enable CONFIG_KPM
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL

          make olddefconfig
          make -j$(nproc) 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp arch/arm64/boot/Image AnyKernel3/

          cd AnyKernel3
          zip -r9 ../kernel-zorn-sukisu.zip . -x "*.git*"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zorn-sukisu
          path: kernel-zorn-sukisu.zip
