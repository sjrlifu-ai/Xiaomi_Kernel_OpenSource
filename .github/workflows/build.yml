name: Build K80 Kernel (SukiSU Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save zorn defconfigs before SukiSU
        run: |
          echo "=== Saving zorn defconfigs ==="
          mkdir -p /tmp/zorn-configs
          cp -r arch/arm64/configs/vendor/zorn-perf/ /tmp/zorn-configs/zorn-perf/ 2>/dev/null || echo "No zorn-perf"
          cp arch/arm64/configs/vendor/zorn_gki_defconfig /tmp/zorn-configs/ 2>/dev/null || echo "No zorn_gki_defconfig"
          cp arch/arm64/configs/vendor/zorn_gki_defconfig /tmp/zorn-configs/zorn_gki_defconfig.bak 2>/dev/null || true
          echo "=== Saved ==="
          ls -la /tmp/zorn-configs/ 2>/dev/null
          ls -la /tmp/zorn-configs/zorn-perf/ 2>/dev/null

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex git gnupg imagemagick \
            libncurses-dev libreadline-dev \
            libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-17-jdk \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 10G

      - name: Integrate SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Restore zorn defconfigs
        run: |
          echo "=== Restoring zorn defconfigs ==="
          mkdir -p arch/arm64/configs/vendor/zorn-perf/
          cp -r /tmp/zorn-configs/zorn-perf/* arch/arm64/configs/vendor/zorn-perf/ 2>/dev/null || echo "No zorn-perf to restore"
          cp /tmp/zorn-configs/zorn_gki_defconfig arch/arm64/configs/vendor/ 2>/dev/null || echo "No gki to restore"
          echo "=== Restored ==="
          find arch/arm64/configs/ -name "*defconfig" 2>/dev/null | sort

      - name: Fix all missing Kconfig references
        run: |
          find . -name "Kconfig" -exec grep -h 'source "' {} \; 2>/dev/null | \
            sed 's/.*source "//;s/".*//' | sort -u | while read f; do
            if [ ! -f "$f" ]; then
              mkdir -p "$(dirname "$f")"
              touch "$f"
              echo "Created: $f"
            fi
          done

      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== Available defconfigs ==="
          find arch/arm64/configs/ -name "*defconfig" 2>/dev/null | sort

          DEFCONFIG="arch/arm64/configs/vendor/zorn-perf/zorn-perf_defconfig"
          echo "Using defconfig: $DEFCONFIG"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: zorn-perf_defconfig not found!"
            exit 1
          fi

          make $DEFCONFIG

          scripts/config --enable CONFIG_KPM
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL

          make olddefconfig
          make -j$(nproc) 2>&1 | tee build.log

      - name: Show build result
        if: always()
        run: |
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log 2>/dev/null || echo "No build log"
          echo ""
          echo "=== Actual errors ==="
          grep -n "error:" build.log 2>/dev/null | tail -30 || echo "No errors found"
          echo ""
          echo "=== arch/arm64/boot/ ==="
          ls -la arch/arm64/boot/ 2>/dev/null || echo "No arch/arm64/boot/"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp arch/arm64/boot/Image AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image AnyKernel3/ 2>/dev/null || \
          { echo "ERROR: No kernel image found"; exit 1; }
          cd AnyKernel3
          zip -r9 ../kernel-zorn-sukisu.zip . -x "*.git*"

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zorn-sukisu
          path: kernel-zorn-sukisu.zip