name: Build K80 Kernel (SukiSU Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex git gnupg imagemagick \
            libncurses-dev libreadline-dev \
            libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc \
            zip zlib1g-dev openjdk-17-jdk \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 10G

      - name: Integrate SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Fix all missing Kconfig references
        run: |
          find . -name "Kconfig" -exec grep -h 'source "' {} \; 2>/dev/null | \
            sed 's/.*source "//;s/".*//' | sort -u | while read f; do
            if [ ! -f "$f" ]; then
              mkdir -p "$(dirname "$f")"
              touch "$f"
              echo "Created: $f"
            fi
          done

      - name: Find correct defconfig
        run: |
          echo "=== All defconfigs in arch/arm64/configs/ ==="
          find arch/arm64/configs/ -name "*defconfig" -o -name "*.config" 2>/dev/null | sort
          echo ""
          echo "=== Searching for zorn anywhere ==="
          find . -name "*zorn*" -path "*/configs/*" 2>/dev/null | head -20
          echo ""
          echo "=== vendor/ configs ==="
          ls -la arch/arm64/configs/vendor/ 2>/dev/null || echo "No vendor/ dir"
          echo ""
          echo "=== GKI fragments ==="
          ls arch/arm64/configs/*.fragment 2>/dev/null | head -10
          echo ""
          echo "=== Checking build.config ==="
          cat build.config.common 2>/dev/null | head -20 || echo "No build.config.common"
          cat build.config.zorn* 2>/dev/null | head -20 || echo "No build.config.zorn*"
          find . -name "build.config*" -path "*zorn*" 2>/dev/null | head -5

      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Try multiple defconfig locations
          DEFCONFIG=""
          for pattern in \
            "arch/arm64/configs/vendor/zorn_defconfig" \
            "arch/arm64/configs/vendor/zorn-perf_defconfig" \
            "arch/arm64/configs/vendor/zorn_gki_defconfig" \
            "arch/arm64/configs/zorn_defconfig" \
            "arch/arm64/configs/zorn-perf_defconfig" \
            "arch/arm64/configs/zorn_gki_defconfig"; do
            if [ -f "$pattern" ]; then
              DEFCONFIG="$pattern"
              break
            fi
          done

          # If no exact match, try find
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs -name "*zorn*" -name "*defconfig" 2>/dev/null | head -1)
          fi

          echo "Using defconfig: $DEFCONFIG"

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: No zorn defconfig found!"
            echo "Available configs:"
            find arch/arm64/configs/ -name "*defconfig" | sort
            exit 1
          fi

          make $DEFCONFIG

          scripts/config --enable CONFIG_KPM
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL

          make olddefconfig
          make -j$(nproc) 2>&1 | tee build.log

      - name: Show build result
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 build.log 2>/dev/null || echo "No build log"
          echo ""
          echo "=== Search for actual error ==="
          grep -n "Error\|error:" build.log 2>/dev/null | tail -20 || echo "No errors found"
          echo ""
          echo "=== arch/arm64/boot/ contents ==="
          ls -la arch/arm64/boot/ 2>/dev/null || echo "No arch/arm64/boot/"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp arch/arm64/boot/Image AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image AnyKernel3/ 2>/dev/null || \
          { echo "ERROR: No kernel image found"; exit 1; }

          cd AnyKernel3
          zip -r9 ../kernel-zorn-sukisu.zip . -x "*.git*"

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zorn-sukisu
          path: kernel-zorn-sukisu.zip